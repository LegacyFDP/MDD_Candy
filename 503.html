<!DOCTYPE html>
<!--
  Maintenance page for Fete Store Manager, served with HTTP status 503.
  Self-contained (no app files needed) so it works while the app is stopped.

  To show it to everyone, add this at the top of the site block in
  /etc/caddy/Caddyfile (before `handle /api*`), then
  `sudo systemctl reload caddy`:

      @maintenance file {
          root /home/timmi/fete-data
          try_files maintenance.on
      }
      handle @maintenance {
          root * /home/timmi/projects/MDD_Candy
          rewrite * /503.html
          file_server {
              status 503
          }
      }

  Turn it on:   touch /home/timmi/fete-data/maintenance.on
  Turn it off:  rm /home/timmi/fete-data/maintenance.on
  (No Caddy reload needed to switch it on or off.)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Check again every minute; the app reappears by itself when it is back. -->
  <meta http-equiv="refresh" content="60">
  <title>Back in a few minutes – Fete Store Manager</title>
  <style>
    :root {
      --mdd-red: #c8102e;
      --mdd-yellow: #f9c800;
      --mdd-ink: #3b1b22;
      --mdd-mist: #fff5d6;
      --soft-text: #6b5a5e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--mdd-ink);
      background: var(--mdd-mist);
    }
    .card {
      width: 100%;
      max-width: 26rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 8px 24px rgba(59, 27, 34, 0.08);
      padding: 2.25rem 1.75rem 1.75rem;
      text-align: center;
    }
    .icon {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--mdd-mist);
    }
    .icon svg { width: 2.4rem; height: 2.4rem; fill: var(--mdd-red); opacity: 0.85; }
    h1 { margin: 0 0 0.75rem; font-size: 1.5rem; font-weight: 600; }
    p { margin: 0.5rem 0; line-height: 1.6; color: var(--soft-text); }
    .note { font-size: 0.875rem; margin-top: 1rem; }
    .dots { display: inline-flex; gap: 0.35rem; margin-top: 1.25rem; }
    .dots span {
      width: 0.45rem; height: 0.45rem; border-radius: 50%;
      background: var(--mdd-yellow);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 0.7; } }
    .footer { margin-top: 1.75rem; font-size: 0.8125rem; color: #9a8a8e; }
  </style>
</head>
<body>
  <main class="card">
    <!-- A paw print, for Medical Detection Dogs -->
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <ellipse cx="32" cy="42" rx="13" ry="11"/>
        <ellipse cx="16" cy="27" rx="6" ry="7.5" transform="rotate(-20 16 27)"/>
        <ellipse cx="26" cy="17" rx="5.5" ry="7.5" transform="rotate(-8 26 17)"/>
        <ellipse cx="38" cy="17" rx="5.5" ry="7.5" transform="rotate(8 38 17)"/>
        <ellipse cx="48" cy="27" rx="6" ry="7.5" transform="rotate(20 48 27)"/>
      </svg>
    </div>
    <h1>Back in a few minutes</h1>
    <p>We&rsquo;re making a few improvements to Fete Store Manager.</p>
    <p class="note">There&rsquo;s nothing you need to do &ndash; this page will reload by itself when we&rsquo;re ready.</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="footer">Medical Detection Dogs &middot; Thank you for your patience</p>
  </main>
</body>
</html>
